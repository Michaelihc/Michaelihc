name: Verify Random Walk Lean

on:
  pull_request:
    branches: [main]
    paths:
      - FormalRandomWalk/**/*.lean
      - FormalRandomWalk/lakefile.toml
      - FormalRandomWalk/lean-toolchain
      - .github/workflows/verify-random-walk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject proof placeholders
        shell: bash
        run: |
          set -euo pipefail
          if grep -Rnw --include='*.lean' -E '(^|[^A-Za-z0-9_])(sorry|admit)([^A-Za-z0-9_]|$)' FormalRandomWalk; then
            echo 'Lean proof placeholder found.' >&2
            exit 1
          fi
          echo 'No sorry/admit placeholders found.'

      - name: Install Elan and selected Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:v4.32.2
          elan default leanprover/lean4:v4.32.2
          lean --version
          lake --version

      - name: Resolve dependencies and build
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cd FormalRandomWalk
          lake update
          lake exe cache get
          lake build

      - name: Independently check compiled environment
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: FormalRandomWalk
          auto-config: false
          build: false
          leanchecker: true
          nanoda: true
          nanoda-allow-sorry: false
          use-mathlib-cache: false
